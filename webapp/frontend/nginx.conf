# Nginx của container web-frontend: phục vụ bản build React, chuyển /api sang backend Spring Boot.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API: backend là service "web-backend" trong compose.yaml. Lần gọi ML đầu có thể mất vài giây (nạp mô hình).
    location /api/ {
        proxy_pass http://web-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # File build có hash trong tên: cache lâu. index.html: không cache để luôn lấy bản mới.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Route của React (/groupby, /ml/kmeans, ...): trả index.html để tải lại trang không bị 404.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
