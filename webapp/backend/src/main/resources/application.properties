# Thư mục serving đã đồng bộ từ HDFS (scripts/serving-sync.ps1); chỉ đọc.
serving.dir=${SERVING_DIR:../../serving}
server.port=${PORT:8080}
spring.mvc.problemdetails.enabled=true
# Nạp sẵn mô hình của serving run mặc định khi khởi động (luồng nền); tắt bằng SERVING_WARMUP=false.
serving.warmup=${SERVING_WARMUP:true}
