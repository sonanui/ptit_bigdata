# Cấu hình Hadoop cho MapReduce LocalJobRunner, được scripts/run-local.sh nạp thành tham số -Dkey=value
# (chọn file khác bằng biến REVENUE_CONF). -D truyền thêm khi gọi script ghi đè giá trị ở đây.
# Giá trị dưới đây là cấu hình đã dùng cho mọi kết quả công bố (E1–E3), trùng mặc định Hadoop 3.4.2 và được ghi lại
# trong run-manifest.json ("configuration"). Đổi giá trị = đổi điều kiện thực nghiệm: ghi rõ khi báo cáo.
fs.defaultFS=file:///
mapreduce.framework.name=local
mapreduce.task.io.sort.mb=100
mapreduce.map.speculative=true
mapreduce.reduce.speculative=true
